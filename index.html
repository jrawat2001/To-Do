<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do</title>
  <meta name="description" content="A simple to-do list with due dates, priorities, and filters. Tasks are stored on your device.">

  <!-- Paths stay relative: the app is served from a /To-Do/ subpath on GitHub
       Pages and must also run straight from the filesystem. -->
  <link rel="preload" href="./fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./styles.css">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="To-Do">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    // Applied before first paint so the page never flashes the wrong theme.
    try {
      var stored = localStorage.getItem('todo.theme');
      var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  </script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>To-Do</h1>
      <div class="header-actions">
        <button id="install" class="install-button" type="button" hidden>Install</button>
        <button id="theme-toggle" class="icon-button" type="button" aria-label="Switch theme">
          <svg class="icon icon-moon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"
                  fill="none" stroke="currentColor" stroke-width="1.7"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.7"/>
            <path d="M12 2.6v2.2M12 19.2v2.2M21.4 12h-2.2M4.8 12H2.6M18.6 5.4l-1.6 1.6M7 17l-1.6 1.6M18.6 18.6 17 17M7 7 5.4 5.4"
                  fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <form id="add-form" class="add-form" autocomplete="off">
      <div class="field field-text">
        <label for="task-text">Task</label>
        <input id="task-text" name="text" type="text" placeholder="What needs doing?" maxlength="200" required>
      </div>
      <div class="field">
        <label for="task-due">Due date</label>
        <input id="task-due" name="due" type="date">
      </div>
      <div class="field">
        <label for="task-priority">Priority</label>
        <select id="task-priority" name="priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>
      <button type="submit" class="primary-button">Add</button>
    </form>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button type="button" class="filter" data-filter="all" aria-pressed="true">All</button>
      <button type="button" class="filter" data-filter="active" aria-pressed="false">Active</button>
      <button type="button" class="filter" data-filter="done" aria-pressed="false">Done</button>
    </div>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty-state" class="empty-state" hidden></p>

    <footer class="app-footer">
      <span id="counter" class="counter" aria-live="polite"></span>
      <button type="button" id="clear-done" class="text-button" hidden>Clear completed</button>
    </footer>
  </div>

  <script src="./app.js"></script>
  <script>
    // Service workers need a real origin, so skip registration on file:// —
    // opening index.html straight from disk still works, just without offline.
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {
          // Offline support is an enhancement; the app works regardless.
        });
      });
    }

    // Chrome and Edge fire this when the app is installable. Safari and Firefox
    // never do, so the button simply stays hidden there.
    (function () {
      var button = document.getElementById('install');
      var deferred = null;

      window.addEventListener('beforeinstallprompt', function (event) {
        event.preventDefault();
        deferred = event;
        button.hidden = false;
      });

      button.addEventListener('click', function () {
        if (!deferred) return;
        deferred.prompt();
        deferred = null;
        button.hidden = true;
      });

      window.addEventListener('appinstalled', function () {
        deferred = null;
        button.hidden = true;
      });
    })();
  </script>
</body>
</html>
